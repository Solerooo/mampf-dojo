<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mampf-Dojo</title>
<meta name="description" content="Anime-Food-Quest zum Zunehmen: 5 Mahlzeiten am Tag, ein Einkauf pro Woche, XP und Level.">
<meta name="theme-color" content="#ff4f8b">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mampf-Dojo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* =====================================================================
   STIL – Manga-Look: dicke Outlines, knallige Farben, Speedlines,
   Halftone-Punkte, Sprechblasen. Mobile first (360–430 px).
   ===================================================================== */
:root {
  --ink: #15121f;
  --bg: #fff1d0;
  --bg-aussen: #ffd9e6;
  --bg-dot: rgba(21, 18, 31, .09);
  --panel: #ffffff;
  --panel-2: #fff6df;
  --text: #15121f;
  --muted: #5d566e;
  --gelb: #ffd23f;
  --pink: #ff4f8b;
  --rot: #ff3b3b;
  --tuerkis: #29c5f6;
  --lila: #7b5cff;
  --gruen: #2fd18b;
  --orange: #ff8a3d;
  --linie: rgba(110, 100, 130, .3);
  --rand: 3px solid var(--ink);
  --schatten: 4px 4px 0 var(--ink);
  --radius: 14px;
  --nav-h: 64px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-titel: "Arial Black", "Helvetica Neue", Helvetica, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #000; --bg: #17131f; --bg-aussen: #0d0a14; --bg-dot: rgba(255, 255, 255, .05);
    --panel: #272038; --panel-2: #312a47; --text: #f6f1ff; --muted: #b9b0cf; --linie: rgba(200, 190, 230, .22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #000; --bg: #17131f; --bg-aussen: #0d0a14; --bg-dot: rgba(255, 255, 255, .05);
  --panel: #272038; --panel-2: #312a47; --text: #f6f1ff; --muted: #b9b0cf; --linie: rgba(200, 190, 230, .22);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; font: 16px/1.45 var(--font); color: var(--text); background: var(--bg-aussen);
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
body.sheet-offen { overflow: hidden; }
button, input, select { font: inherit; }
:focus-visible { outline: 3px solid var(--tuerkis); outline-offset: 2px; }
.app {
  max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.5px);
  background-size: 12px 12px;
}
@media (min-width: 520px) {
  body { background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .25) 0 14px, transparent 14px 28px); }
  .app { border-left: var(--rand); border-right: var(--rand); }
}
.main {
  padding: calc(env(safe-area-inset-top) + 12px) 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);
  display: flex; flex-direction: column; gap: 14px; outline: none;
}
.muted { color: var(--muted); }
.klein { font-size: 13px; }
p { margin: 6px 0; }
h4 { margin: 12px 0 2px; font-size: 15px; }

/* ---------- Typo ---------- */
.titel { font-family: var(--font-titel); font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 21px; line-height: 1.12; margin: 0; letter-spacing: .01em; overflow-wrap: anywhere; }
.titel small { font-size: 14px; color: var(--muted); font-style: normal; }
.titel-klein { font-family: var(--font-titel); font-weight: 900; font-size: 15px; text-transform: uppercase; margin: 0 0 8px; letter-spacing: .02em; }
.titel-klein small { color: var(--muted); font-family: var(--font); }
.titel-mega {
  font-family: var(--font-titel); font-size: clamp(30px, 10vw, 44px); font-weight: 900; font-style: italic; text-align: center; margin: 4px 0 12px; white-space: nowrap;
  color: var(--gelb); -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink), 7px 7px 0 var(--pink); transform: rotate(-3deg);
}

/* ---------- Panels, Speedlines ---------- */
.panel { background: var(--panel); border: var(--rand); border-radius: var(--radius); box-shadow: var(--schatten); padding: 14px; position: relative; }
.speed {
  background-image: repeating-conic-gradient(from 0deg at 12% 18%, rgba(255, 210, 63, .32) 0deg 3deg, transparent 3deg 9deg);
}
.hero { padding-top: 12px; }
.hero::after {
  content: ''; position: absolute; right: -3px; top: -3px; width: 70px; height: 70px; pointer-events: none;
  background: linear-gradient(225deg, var(--pink) 0 32%, var(--ink) 32% 36%, transparent 36%); border-top-right-radius: var(--radius);
}

/* ---------- Maskottchen & Sprechblase ---------- */
.maskottchen { width: 86px; height: auto; flex: none; display: block; filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, .18)); }
.maskottchen.mittel { width: 104px; }
.maskottchen.gross { width: 150px; }
.maskottchen-zeile { display: flex; align-items: flex-end; gap: 12px; }
.maskottchen-zeile.klein .maskottchen { width: 60px; }
.blase {
  position: relative; flex: 1; min-width: 0; background: #fff; color: #15121f; border: 3px solid #15121f; border-radius: 18px;
  padding: 10px 12px; font-weight: 800; font-size: 15px; line-height: 1.35; box-shadow: 3px 3px 0 #15121f; margin-bottom: 18px;
}
.blase::before { content: ''; position: absolute; left: -15px; bottom: 12px; border-style: solid; border-width: 8px 15px 8px 0; border-color: transparent #15121f transparent transparent; }
.blase::after { content: ''; position: absolute; left: -9px; bottom: 15px; border-style: solid; border-width: 5px 10px 5px 0; border-color: transparent #fff transparent transparent; }
.blase p { margin: 0; }

/* ---------- Balken ---------- */
.bar { height: 16px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--panel-2); overflow: hidden; margin: 4px 0 10px; }
.bar i {
  display: block; height: 100%; background-color: var(--pink); border-right: 2.5px solid var(--ink);
  background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .38) 0 6px, transparent 6px 12px);
  transition: width .6s cubic-bezier(.2, .9, .3, 1.15);
}
.bar.kcal i { background-color: var(--orange); }
.bar.kcal.voll i { background-color: var(--gruen); }
.bar.protein i { background-color: var(--tuerkis); }
.bar.xp i { background-color: var(--gelb); }
.bar.hp i { background-color: var(--rot); }
.bar.gruen i { background-color: var(--gruen); }
.bar.rot i { background-color: var(--rot); }
.ziel-zeile { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: 14px; margin-top: 4px; }
.ziel-zeile b { font-family: var(--font-titel); font-size: 18px; white-space: nowrap; }
.ziel-zeile small { font-size: 12px; color: var(--muted); font-family: var(--font); }

/* ---------- Level ---------- */
.lvl-reihe { display: flex; align-items: center; gap: 12px; margin: 2px 0 8px; }
.lvl-badge {
  font-family: var(--font-titel); font-weight: 900; font-size: 18px; background: var(--pink); color: #fff; border: var(--rand);
  border-radius: 10px; padding: 6px 10px; transform: rotate(-6deg); box-shadow: 3px 3px 0 var(--ink); flex: none; white-space: nowrap;
}
.lvl-info { flex: 1; min-width: 0; }
.lvl-info .bar { margin: 4px 0 2px; height: 12px; }
.lvl-info small, .rang-karte small { font-size: 12px; color: var(--muted); font-weight: 700; }

/* ---------- Buttons ---------- */
.btn {
  font-weight: 900; min-height: 48px; padding: 10px 16px; border: var(--rand); border-radius: 12px; background: var(--gelb); color: #15121f;
  box-shadow: 3px 3px 0 var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-align: center; text-decoration: none; touch-action: manipulation; transition: transform .08s, box-shadow .08s; line-height: 1.15;
}
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn small { font-weight: 700; opacity: .8; font-size: 12px; }
.btn-ghost { background: var(--panel); color: var(--text); }
.btn-gross { min-height: 56px; font-size: 18px; }
.btn-klein { min-height: 44px; padding: 8px 12px; font-size: 14px; }
.btn-lila { background: var(--lila); color: #fff; }
.btn-tuerkis { background: var(--tuerkis); }
.btn-gruen { background: var(--gruen); }
.btn-rot { background: var(--rot); color: #fff; margin-top: 12px; }
.voll { width: 100%; }
.knopf-reihe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.btn-x { min-width: 44px; min-height: 44px; border: 0; background: none; font-size: 18px; color: var(--muted); cursor: pointer; border-radius: 10px; }
.btn-x.gross { font-size: 24px; color: var(--text); }
.btn-fav { min-width: 48px; min-height: 48px; border: 0; background: none; font-size: 28px; cursor: pointer; margin-left: auto; flex: none; }

/* ---------- Chips, Tags, Auswahl ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 13px; font-weight: 800; padding: 5px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--panel); color: var(--text); min-height: 32px; display: inline-flex; align-items: center; gap: 4px; }
.chip-btn, .chip-link { cursor: pointer; min-height: 44px; }
.chip-btn small { color: var(--muted); }
.chip-feuer { background: var(--orange); color: #15121f; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 800; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--panel-2); color: var(--text); white-space: nowrap; }
.tag-reste { background: #c9f5df; color: #15121f; }
.tag-koch, .tag-angebot { background: var(--gelb); color: #15121f; }
.tag-mild { background: #d6f1ff; color: #15121f; }
.tag-premium { background: #ffe08a; color: #15121f; }
.tag-chill { background: var(--lila); color: #fff; }
.tag-heute { background: var(--pink); color: #fff; }
.tag-frisch { background: #ffdcdc; color: #15121f; }
.wahl-reihe { display: flex; gap: 8px; flex-wrap: wrap; }
.wahl {
  font-weight: 800; min-height: 44px; padding: 8px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--panel);
  color: var(--text); cursor: pointer; touch-action: manipulation;
}
.wahl.an { background: var(--gelb); color: #15121f; box-shadow: 2px 2px 0 var(--ink); }
.wahl.an.rot { background: #ffc4c4; }
.wahl:disabled { opacity: .4; cursor: not-allowed; }
.wahl small { font-weight: 600; opacity: .75; }
.wochentage .wahl { min-width: 46px; }
.wahl-liste { display: grid; gap: 8px; }
.wahl-karte {
  text-align: left; border: var(--rand); border-radius: 12px; background: var(--panel); color: var(--text); padding: 12px;
  min-height: 56px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
}
.wahl-karte span { font-size: 14px; color: var(--muted); }
.wahl-karte.an { background: var(--gelb); color: #15121f; box-shadow: 3px 3px 0 var(--ink); }
.wahl-karte.an span { color: #3a3348; }

/* ---------- Formulare ---------- */
.feld { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; font-weight: 700; font-size: 14px; }
input[type=text], input[type=number], input[type=search], input[type=date], input[type=url], select {
  font-size: 16px; min-height: 48px; padding: 10px 12px; border: 2.5px solid var(--ink); border-radius: 10px;
  background: var(--panel); color: var(--text); width: 100%; min-width: 0; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--text) 50%), linear-gradient(135deg, var(--text) 50%, transparent 50%); background-position: calc(100% - 18px) 21px, calc(100% - 12px) 21px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; }
input[type=date] { min-width: 0; }
input[type=range] { width: 100%; accent-color: var(--pink); min-height: 44px; }
.feld-reihe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feld-reihe .feld { margin: 6px 0; }
.extra-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.extra-form input[name=text], .extra-form .btn { grid-column: 1 / -1; }
.gewicht-form { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; margin-top: 8px; }
.gewicht-form .btn { grid-column: 1 / -1; }
.bon-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
.such-reihe { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 10px 0; }

/* ---------- Statistik-Kacheln ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.stat-grid.drei, .stat-grid.sechs { grid-template-columns: repeat(3, 1fr); }
.stat { background: var(--panel-2); border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; justify-content: center; min-height: 64px; min-width: 0; }
.stat b { font-family: var(--font-titel); font-size: 17px; overflow-wrap: anywhere; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; }
.stat.gelb { background: var(--gelb); color: #15121f; }
.stat.gelb span { color: #3a3348; }

/* ---------- HEUTE: Mahlzeit-Karten ---------- */
.tag-kopf { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.mahlzeit { padding: 12px; overflow: hidden; }
.mahlzeit.gegessen { background: linear-gradient(0deg, rgba(47, 209, 139, .12), rgba(47, 209, 139, .12)), var(--panel); }
.mz-kopf { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.mz-slot { font-family: var(--font-titel); font-weight: 900; font-size: 12px; text-transform: uppercase; background: #15121f; color: #fff; padding: 3px 10px; border-radius: 6px; transform: skewX(-10deg); display: inline-block; letter-spacing: .03em; }
.mz-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.mz-haupt { display: flex; gap: 12px; align-items: center; width: 100%; border: 0; background: none; padding: 4px 0; text-align: left; color: inherit; cursor: pointer; min-height: 64px; }
.mz-emoji, .rk-emoji { font-size: 36px; width: 62px; height: 62px; flex: none; display: grid; place-items: center; background: var(--panel-2); border: 2.5px solid var(--ink); border-radius: 50%; box-shadow: 2px 2px 0 var(--ink); }
.mz-text, .rk-text { min-width: 0; flex: 1; }
.mz-text b, .rk-text b { display: block; font-size: 16.5px; line-height: 1.2; overflow-wrap: anywhere; }
.mz-meta { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 700; }
.mz-knoepfe { display: grid; grid-template-columns: 1.45fr 1fr; gap: 10px; margin-top: 8px; }
.btn-essen.an { background: var(--gruen); flex-direction: column; gap: 0; }
.btn-essen.an small { font-size: 11px; }
.tag-kopf + .knopf-reihe .btn { font-size: 15px; padding: 8px 10px; }
.stempel {
  position: absolute; left: 4px; top: 58px; font-family: var(--font-titel); font-weight: 900; font-size: 15px; color: var(--rot);
  border: 3px solid var(--rot); border-radius: 8px; padding: 0 6px; transform: rotate(-14deg); opacity: .9; pointer-events: none;
  background: rgba(255, 255, 255, .7); animation: stempel .35s cubic-bezier(.2, 1.6, .4, 1);
}
@keyframes stempel { from { transform: rotate(-14deg) scale(2.4); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .85; } }
.extra .schnell-reihe { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.extra-liste { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; }
.extra-liste li { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; align-items: center; font-size: 14px; border-bottom: 1.5px dashed var(--linie); min-height: 44px; }
.hinweis { background: #e3f6ff; color: #15121f; border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
.hinweis.warnung { background: #ffdede; }
.hinweis .maskottchen-zeile { margin-bottom: 6px; }
.hinweis-panel { background: #fff1c9; color: #15121f; }
.hinweis-panel ul { margin: 0; padding-left: 18px; }
.leer { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }

/* ---------- WOCHE ---------- */
.wochen-navi { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 900; }
.boss { background: linear-gradient(135deg, #2a1f45, #51307a); color: #fff; overflow: hidden; }
.boss::before { content: ''; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 85% 20%, rgba(255, 79, 139, .22) 0 4deg, transparent 4deg 11deg); pointer-events: none; }
.boss > * { position: relative; }
.boss-kopf { display: flex; gap: 12px; align-items: center; }
.boss-kopf small { letter-spacing: .18em; font-weight: 900; color: var(--pink); font-size: 12px; }
.boss .titel { color: var(--gelb); -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0 #000; font-size: 20px; }
.boss-emoji { font-size: 56px; line-height: 1; filter: drop-shadow(3px 3px 0 #000); animation: boss-wackel 2.6s ease-in-out infinite; display: inline-block; }
.boss-emoji.riesig { font-size: 110px; }
.boss.besiegt .boss-emoji { filter: grayscale(1) drop-shadow(3px 3px 0 #000); transform: rotate(90deg); animation: none; }
.boss-spruch { font-style: italic; font-weight: 700; margin: 8px 0; }
.boss .muted, .boss .ziel-zeile small { color: #ddd1f5; }
@keyframes boss-wackel { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(4deg); } }
.tag-karte { padding: 12px; }
.tag-karte.heute { border-color: var(--pink); box-shadow: 4px 4px 0 var(--pink); }
.tag-karte.vorbei { opacity: .72; }
.tag-karte-kopf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
.tag-karte-werte { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--muted); }
.tag-mahlzeiten { list-style: none; margin: 0; padding: 0; }
.tag-mz { width: 100%; display: flex; gap: 8px; align-items: center; text-align: left; color: inherit; background: none; border: 0; border-top: 1.5px dashed var(--linie); min-height: 44px; padding: 6px 2px; cursor: pointer; }
.tag-mz-name { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; }
.tag-mz.gegessen .tag-mz-name { text-decoration: line-through; opacity: .6; }

/* ---------- EINKAUF ---------- */
.check-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; min-height: 56px; padding: 8px 2px; border-bottom: 1.5px dashed var(--linie); cursor: pointer; position: relative; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.check-box { width: 30px; height: 30px; border: var(--rand); border-radius: 8px; background: var(--panel); display: grid; place-items: center; transition: background .15s; }
.check.an .check-box { background: var(--gruen); }
.check.an .check-box::after { content: '✓'; font-weight: 900; color: #15121f; font-size: 20px; line-height: 1; }
.check input:focus-visible + .check-box { outline: 3px solid var(--tuerkis); outline-offset: 2px; }
.check.an .check-text b { text-decoration: line-through; opacity: .55; }
.check.nichts { opacity: .6; cursor: default; }
.check-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.check-text b { overflow-wrap: anywhere; }
.check-text > span:last-child:empty { display: none; }
.check-text .tag { margin-right: 4px; }
.check-preis { font-weight: 900; font-size: 14px; white-space: nowrap; }
.prospekte { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

/* ---------- REZEPTE ---------- */
.rezepte-kopf .wahl-reihe { margin-bottom: 2px; }
.rezept-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rezept-karte, .tausch-btn { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; color: inherit; cursor: pointer; padding: 10px 12px; }
.rk-emoji { width: 56px; height: 56px; font-size: 32px; }
.rk-tags { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 700; }
.tausch-liste { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 10px; }
.rezept-kopf { display: flex; gap: 12px; align-items: center; margin: 4px 40px 8px 0; }
.rezept-emoji { font-size: 54px; flex: none; line-height: 1; filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, .15)); }
.zutaten { list-style: none; margin: 4px 0 12px; padding: 0; }

      return { status: 'ok', tage, wochen: tage / 7, verlauf };

      return { status: 'plateau', plateauKg: gleichgewichtsGewicht(p, kcalProTag), verlauf };

/* Durchschnitt der wirklich gegessenen kcal der letzten 7 Tage (ohne heute).

function kcalSchnitt(z, tu) {

/* Kalibrierung: ab 3 Wochen + 4 Wiegungen den TDEE anhand echter Daten
   korrigieren (geglättet, max. ±150 kcal pro Woche). */
function pruefeKalibrierung(z, tu) {
  if (!z.profil || z.gewichte.length < 4) return null;
  const erstes = gewichteSortiert(z)[0].datum;
  if (tageZwischen(erstes, heute()) < 21) return null;
  if (z.kalibrierung.letzte && tageZwischen(z.kalibrierung.letzte, heute()) < 7) return null;
  const trend = gewichtsTrend(z, 21);
  if (!trend) return null;
  tu = tu || tagesUebersicht(z);
  let s = 0, n = 0;
  for (let i = 1; i <= 21; i++) { const e = tu[addTage(heute(), -i)]; if (e && e.geloggt) { s += e.kcal; n++; } }

  const beobachtet = schnitt - trend.kgProTag * KCAL_PRO_KG;
  const zielKorrektur = beobachtet - tdeeFormel(z.profil, trend.mittelKg);
  const alt = z.profil.tdeeKorrektur || 0;
  const schritt = clamp((zielKorrektur - alt) * 0.5, -150, 150);
  const neu = Math.round(clamp(alt + schritt, -800, 800));

}
function wendeKalibrierungAn(z, k) {
  z.kalibrierung.letzte = heute();

  z.kalibrierung.verlauf.push({ datum: heute(), delta: k.delta, neu: k.neu });
  aktualisiereZiele(z);
  return true;
}

  plan[pos] = zufallsPool(K, Math.floor(pos / 5), pos % 5, rnd);
  return [pos, alt];
}
function machRueckgaengig(plan, zug) { for (let i = zug.length - 2; i >= 0; i -= 2) plan[zug[i]] = zug[i + 1]; }

/* Simulated Annealing: verschlechternde Züge werden anfangs öfter akzeptiert (Temperatur) */
function annealing(plan, K, rnd, N, T0, T1, f0) {
  f0 = f0 != null ? f0 : GEN.hartStart;
  const fEnde = GEN.hartEnde;
  K.hartFaktor = f0;
  let akt = bewertePlan(plan, K), lokal = plan.slice();
  let lokalStrafe = K.letzteWeich + fEnde * K.letzteHart; // Bestes immer nach End-Gewichtung
  K.totAkt.set(K.tot);
  for (let it = 0; it < N; it++) {
    if (it % 250 === 0) { // Strafgewicht schrittweise erhöhen
      K.hartFaktor = f0 + (fEnde - f0) * Math.min(1, it / (0.8 * N));
      akt = bewertePlan(plan, K);
    }
    const T = T0 * Math.pow(T1 / T0, it / N);
    const zug = schlageZugVor(plan, K, rnd);
    const neu = bewertePlan(plan, K);
    if (neu <= akt || rnd() < Math.exp((akt - neu) / T)) {
      akt = neu;
      K.totAkt.set(K.tot);
      const endWert = K.letzteWeich + fEnde * K.letzteHart;
      if (endWert < lokalStrafe) { lokalStrafe = endWert; lokal = plan.slice(); }
    } else machRueckgaengig(plan, zug);
  }
  K.hartFaktor = fEnde;
  return { plan: lokal, strafe: lokalStrafe };
}

/* Feinschliff: jeden Slot einzeln gegen jede Alternative testen, bis sich
   nichts mehr verbessert (repariert knappe Budget-/Ziel-Verfehlungen). */
function poliere(plan, K, strafe) {
  for (let runde = 0; runde < 4; runde++) {
    let besser = false;
    for (let pos = 0; pos < 35; pos++) {
      const pool = K.tagPools[Math.floor(pos / 5)][SLOT_TYPEN[pos % 5]], alt = plan[pos];
      let bestC = alt;
      for (const c of pool) {
        if (c === alt) continue;
        plan[pos] = c;
        const neu = bewertePlan(plan, K);
        if (neu < strafe - 0.01) { strafe = neu; bestC = c; besser = true; }
      }
      plan[pos] = bestC;
    }
    if (!besser) break;
  }
  return strafe;
}

/* ---------- Hauptfunktion: neue Woche generieren ---------- */
function generiereWoche(z, optionen) {
  optionen = optionen || {};
  const p = z.profil, start = optionen.start || heute(), zz = ziele(z);
  const seed = optionen.seed != null ? optionen.seed : ((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
  const angebote = optionen.angebote || {};
  const bestand = optionen.bestand || berechneBestand(z, start);
  const opts = { profil: p, start, zielKcal: zz.kcal, zielProtein: zz.protein, budget: wochenbudget(p), angebote, bestand, favoriten: z.favoriten };
  const K = baueKontext(opts);
  const rnd = zufall(seed);
  const N = optionen.iterationen || GEN.iterationen, neustarts = optionen.neustarts || GEN.neustarts;
  let bester = null, besteStrafe = Infinity;
  for (let n = 0; n < neustarts; n++) {
    const erg = annealing(startPlan(K, rnd), K, rnd, N, GEN.tStart, GEN.tEnde);
    if (erg.strafe < besteStrafe) { besteStrafe = erg.strafe; bester = erg.plan; }
  }
  besteStrafe = poliere(bester, K, besteStrafe);
  // Ab hier: jede Stufe wird mit den NORMALEN Gewichten verglichen – nur echte Verbesserungen gewinnen.
  const normalWert = plan => {
    const b = K.budgetBasis, e = K.budgetProEuro;
    K.budgetBasis = 250; K.budgetProEuro = 250;
    const wert = bewertePlan(plan, K);
    K.budgetBasis = b; K.budgetProEuro = e;
    return wert;
  };
  besteStrafe = normalWert(bester);
  const nimmWennBesser = plan => { const wert = normalWert(plan); if (wert < besteStrafe) { besteStrafe = wert; bester = plan.slice(); } };
  const offen = () => { normalWert(bester); return K.letzteRegeln > 0 || K.letzteKosten > K.budget; };
  // Reparatur: noch über Budget? → mit verschärfter Budgetstrafe vom besten Plan aus weitersuchen
  for (let versuch = 0; versuch < 2 && (normalWert(bester), K.letzteKosten > K.budget); versuch++) {
    K.budgetBasis = 3000; K.budgetProEuro = 1500;
    const erg = annealing(bester.slice(), K, rnd, N, 40, 0.3, 1);
    poliere(erg.plan, K, erg.strafe);
    K.budgetBasis = 250; K.budgetProEuro = 250;
    nimmWennBesser(erg.plan);
  }
  // Sicherheitsnetz: bei verbliebenen Regelverstößen bis zu 3 weitere Neustarts
  for (let extra = 0; extra < 3 && offen(); extra++) {
    const erg = annealing(startPlan(K, rnd), K, rnd, N, GEN.tStart, GEN.tEnde);
    poliere(erg.plan, K, erg.strafe);
    nimmWennBesser(erg.plan);
  }
  // Letzte Stufe: Regeln gehen vor Komfort – ohne Premium-/Abwechslungs-Bonus reparieren
  if (offen()) {
    const verstoss = () => K.letzteRegeln + (K.letzteKosten > K.budget ? 1000 + (K.letzteKosten - K.budget) * 100 : 0);
    normalWert(bester);
    const vorher = verstoss();
    const merk = { p: GEN.premiumStrafe, r: GEN.vielfaltRezept, k: GEN.vielfaltKueche, w: GEN.wiederholung };
    GEN.premiumStrafe = 0; GEN.vielfaltRezept = 0; GEN.vielfaltKueche = 0; GEN.wiederholung = 0;
    const erg = annealing(bester.slice(), K, rnd, N, 40, 0.3, 1);
    poliere(erg.plan, K, erg.strafe);
    GEN.premiumStrafe = merk.p; GEN.vielfaltRezept = merk.r; GEN.vielfaltKueche = merk.k; GEN.wiederholung = merk.w;
    normalWert(erg.plan);
    if (verstoss() < vorher) { bester = erg.plan; }
  }
  K.budgetBasis = 250; K.budgetProEuro = 250;
  besteStrafe = bewertePlan(bester, K);
  // Plan in ein speicherbares Wochen-Objekt umwandeln
  const tage = [];
  for (let d = 0; d < 7; d++) {
    let sumK = 0;
    for (let s = 0; s < 5; s++) sumK += K.kand[bester[d * 5 + s]].kcal;
    const skala = tagesSkala(sumK, K.zielK);
    const slots = [];
    for (let s = 0; s < 5; s++) {
      const c = K.kand[bester[d * 5 + s]];
      slots.push({ rid: c.rid, mild: c.mild, skala, kcal: Math.round(c.kcal * skala), protein: rund1(c.protein * skala), gegessen: false });
    }
    tage.push({ datum: addTage(start, d), chill: !!K.chill[d], zielKcal: zz.kcal, zielProtein: zz.protein, slots });
  }
  const woche = {
    id: 'w' + start + '-' + seed.toString(36), start, erstelltAm: heute(), seed, tage,
    angebote, budget: rund2(opts.budget), boss: bossFuer(start), einkauf: null, warnungen: [], strafe: Math.round(besteStrafe),
  };
  woche.einkauf = erstelleEinkaufsliste(woche, bestand);
  woche.warnungen = pruefeRegeln(woche, p);
  return woche;
}

/* ---------- Woche analysieren: Ketten, Reste, Aufwand, Bedarf, Frische ---------- */
function analysiereWoche(woche) {
  const aktiv = {}, instanzen = [], bedarf = {}, ersterTag = {}, rCount = {}, kTotal = {}, frisch = [];
  const slotInfo = [], tage = [];
  let premium = 0;
  woche.tage.forEach((t, ti) => {
    const d = tageZwischen(woche.start, t.datum);
    const info = [];
    let kcal = 0, protein = 0, reiz = 0;
    t.slots.forEach((s, si) => {
      const r = rezeptVon(s.rid, s.mild), kk = kettenSchluessel(r);
      let rest = false, inst = null;
      if (kk) {
        const a = aktiv[kk];
        if (a && d - a.d < r.haltbarTage && a.slots.length < r.mealPrepPortionen) { rest = true; inst = a; }
        else { inst = { d, datum: t.datum, ti, si, slots: [], skalaSumme: 0 }; aktiv[kk] = inst; instanzen.push(inst); }
        inst.slots.push([ti, si]); inst.skalaSumme += s.skala;
        kTotal[kk] = (kTotal[kk] || 0) + 1;
      }
      const kochTag = rest ? inst.d : d;
      for (const zt of r.zutaten) {
        const m = zt.menge * s.skala;
        bedarf[zt.id] = (bedarf[zt.id] || 0) + m;
        const nutzTag = (kk && (r.basisId ? zt.basis : true)) ? kochTag : d;
        if (ersterTag[zt.id] == null || nutzTag < ersterTag[zt.id]) ersterTag[zt.id] = nutzTag;
        if (nutzTag >= ZUTAT[zt.id].haltbarRohTage) frisch.push({ ti, si, datum: t.datum, rid: r.id, zutat: zt.id, tag: nutzTag });
      }
      rCount[r.id] = (rCount[r.id] || 0) + 1;
      if (r.reiz.length) reiz++;
      if (r.premium) premium++;
      kcal += s.kcal; protein += s.protein;
      info.push({
        r, rest, kette: kk, kochTag, kochDatum: rest ? inst.datum : t.datum,
        aufwand: rest ? r.aufwandReste : r.aufwand, abwasch: rest ? r.abwaschReste : r.abwasch,
        portionen: 1, skalaSumme: s.skala, resteAn: [],
      });
    });
    slotInfo.push(info);
    tage.push({ datum: t.datum, d, kcal, protein: rund1(protein), reiz, chill: !!t.chill });
  });
  for (const inst of instanzen) {
    const inf = slotInfo[inst.ti][inst.si];
    inf.portionen = inst.slots.length; inf.skalaSumme = inst.skalaSumme;
    inf.resteAn = inst.slots.slice(1).map(([a]) => woche.tage[a].datum);
  }
  return { tage, slotInfo, bedarf, ersterTag, rCount, kTotal, frisch, premium };
}

/* ---------- Einkaufsliste: Woche zusammenfassen, auf Packungen runden ---------- */
function erstelleEinkaufsliste(woche, bestand) {
  const A = analysiereWoche(woche);
  const items = [], vorrat = [];
  for (const id of Object.keys(A.bedarf)) {
    const menge = A.bedarf[id];
    if (menge <= 0.0001) continue;
    const z = ZUTAT[id], preis = angebotsPreis(id, woche.angebote);
    if (z.vorrat) {
      vorrat.push({ id, menge, packs: Math.max(1, Math.ceil(menge / z.packung - 0.03)), preisPack: preis, anteil: rund2(menge / z.packung * preis) });
      continue;
    }
    const b = Math.min(menge, (bestand && bestand[id]) || 0);
    const packs = packungenFuer(menge - b, z.packung);
    items.push({
      id, menge, bestand: b, packs, kaufMenge: packs * z.packung, preis: rund2(packs * preis),
      angebot: !!(woche.angebote && id in woche.angebote),
      bis: z.haltbarRohTage <= 7 ? addTage(woche.start, z.haltbarRohTage - 1) : null,
    });
  }
  const ord = id => ABTEILUNGEN.findIndex(a => a.id === ZUTAT[id].abteilung);
  const sortiere = (a, b) => ord(a.id) - ord(b.id) || ZUTAT[a.id].name.localeCompare(ZUTAT[b.id].name, 'de');
  items.sort(sortiere); vorrat.sort(sortiere);
  const kostenFrisch = rund2(items.reduce((s, i) => s + i.preis, 0));
  const kostenVorrat = rund2(vorrat.reduce((s, i) => s + i.anteil, 0));
  return { items, vorrat, abgehakt: {}, vorratDa: {}, erledigt: false, erledigtAm: null, kostenFrisch, kostenVorrat, kostenPlan: rund2(kostenFrisch + kostenVorrat) };
}
/* Was kostet der Einkauf an der Kasse? (frische Ware + Vorrat, der nicht mehr da ist) */
function kassenSchaetzung(einkauf) {
  let s = einkauf.kostenFrisch;
  for (const v of einkauf.vorrat) if (!einkauf.vorratDa[v.id]) s += v.packs * v.preisPack;
  return rund2(s);
}

/* ---------- Regeln prüfen → „Was nicht ganz passt“ ---------- */
function pruefeRegeln(woche, p, A) {
  A = A || analysiereWoche(woche);
  const w = [];
  A.tage.forEach((t, i) => {
    const tag = woche.tage[i];
    const abw = (t.kcal - tag.zielKcal) / tag.zielKcal;
    if (Math.abs(abw) > GEN.kcalToleranz) w.push({ typ: 'kcal', text: fmtTag(t.datum) + ': ' + fmtZahl(t.kcal) + ' kcal (' + (abw > 0 ? '+' : '') + fmtZahl(abw * 100) + ' % zum Ziel)' });
    if (t.protein < tag.zielProtein * GEN.proteinMin) w.push({ typ: 'protein', text: fmtTag(t.datum) + ': nur ' + fmtZahl(t.protein) + ' g Protein (' + fmtZahl(t.protein / tag.zielProtein * 100) + ' % vom Ziel)' });
    if (p.magenModus === 'sparsam' && t.reiz > 1) w.push({ typ: 'magen', text: fmtTag(t.datum) + ': ' + t.reiz + ' eher reizende Gerichte (sauer/fettig/scharf)' });
    if (t.chill) A.slotInfo[i].forEach(inf => { if (inf.aufwand > 1) w.push({ typ: 'chill', text: fmtTag(t.datum) + ' (Chill-Tag): ' + inf.r.name + ' ist aufwendig' }); });
  });
  const kosten = woche.einkauf ? woche.einkauf.kostenPlan : 0;
  if (kosten > woche.budget + 0.005) w.push({ typ: 'budget', text: 'Plan kostet ' + fmtEuro(kosten) + ' – ' + fmtEuro(kosten - woche.budget) + ' über dem Wochenbudget.' });
  const gesehen = {};
  for (const f of A.frisch) {
    const k = f.zutat + f.datum;
    if (gesehen[k]) continue;
    gesehen[k] = true;
    w.push({ typ: 'frisch', text: (ZUTAT[f.zutat].kurz || ZUTAT[f.zutat].name) + ' am ' + fmtTag(addTage(woche.start, f.tag)) + ' evtl. nicht mehr frisch – lieber früher kochen.' });
  }
  for (const rid of Object.keys(A.rCount)) if (A.rCount[rid] > 3) w.push({ typ: 'wiederholung', text: REZEPT[rid].name + ' kommt ' + A.rCount[rid] + '× vor (max. 3).' });
  if (A.premium < 2) w.push({ typ: 'info', text: 'Diese Woche nur ' + A.premium + ' Premium-Gericht' + (A.premium === 1 ? '' : 'e') + ' – das Budget war knapp.' });
  return w;
}

/* ---------- Reste aus der Vorwoche (haltbare Zutaten) ---------- */
function berechneBestand(z, neuerStart) {
  const vorher = z.wochen.filter(w => w.start < neuerStart && w.einkauf && w.einkauf.erledigt).sort((a, b) => a.start < b.start ? -1 : 1).pop();
  if (!vorher) return {};
  const teil = Object.assign({}, vorher, { tage: vorher.tage.filter(t => t.datum < neuerStart) });
  const verbrauch = analysiereWoche(teil).bedarf;
  const alter = tageZwischen(vorher.start, neuerStart), out = {};
  for (const it of vorher.einkauf.items) {
    const zt = ZUTAT[it.id];
    if (!zt || zt.haltbarRohTage - alter < 7) continue; // muss noch die ganze neue Woche halten
    const rest = it.kaufMenge + (it.bestand || 0) - (verbrauch[it.id] || 0);
    if (rest > (zt.einheit === 'Stk' ? 0.9 : 15)) out[it.id] = zt.einheit === 'Stk' ? Math.floor(rest) : Math.floor(rest);
  }
  return out;
}

/* ---------- Tauschen (nur mit Zutaten, die diese Woche eingekauft wurden) ---------- */
function verfuegbar(woche) {
  const v = {};
  for (const it of woche.einkauf.items) v[it.id] = it.kaufMenge + (it.bestand || 0);
  return v;
}
function wocheMitSlot(woche, ti, si, slot) {
  return Object.assign({}, woche, { tage: woche.tage.map((t, i) => i !== ti ? t : Object.assign({}, t, { slots: t.slots.map((s, j) => j === si ? slot : s) })) });
}
function neuerSlot(r, mild, kcalZiel) {
  const skala = clamp(Math.round(kcalZiel / r.kcalExakt * 20) / 20, GEN.skalaMin, GEN.skalaMax);
  return { rid: r.id, mild, skala, kcal: Math.round(r.kcalExakt * skala), protein: rund1(r.proteinExakt * skala), gegessen: false };
}
/* Alternativen für einen Slot. modus: 'tausch' | 'keinbock' (Aufwand 0–1) | 'magen' (magenschonend) */
function ersatzKandidaten(z, wi, ti, si, modus) {
  modus = modus || 'tausch';
  const woche = z.wochen[wi], tag = woche.tage[ti], slot = tag.slots[si];
  const typ = SLOTS[si].typ, verf = verfuegbar(woche);
  const altKosten = rezeptVon(slot.rid, slot.mild).kostenExakt * slot.skala;
  const liste = [];
  for (const roh of REZEPTE_ROH) {
    if (roh.id === slot.rid) continue;
    const e = effektivesRezept(roh.id, z.profil);
    if (!e) continue;
    const r = e.r;
    if (slotTypVon(r) !== typ) continue;
    if (modus === 'magen' && !r.magenschonend) continue;
    if (tag.slots.some((s, j) => j !== si && s.rid === r.id)) continue; // nicht 2× am selben Tag
    const ns = neuerSlot(r, e.mild, slot.kcal);
    const A = analysiereWoche(wocheMitSlot(woche, ti, si, ns));
    const inf = A.slotInfo[ti][si];
    if ((modus === 'keinbock' || tag.chill) && inf.aufwand > 1) continue;
    if ((A.rCount[r.id] || 0) > 3) continue;
    if (A.frisch.some(f => f.ti === ti && f.si === si)) continue;
    // fehlt = Menge reicht nicht; nichtGekauft = Zutat steht gar nicht auf der Einkaufsliste
    const fehlt = [];
    let nichtGekauft = 0;
    for (const zt of r.zutaten) {
      const d = ZUTAT[zt.id];
      if (d.vorrat || fehlt.some(f => f.id === zt.id)) continue;
      const hat = verf[zt.id] || 0, braucht = A.bedarf[zt.id] || 0;
      if (braucht > hat + Math.max(1, 0.03 * d.packung)) {
        fehlt.push({ id: zt.id, menge: braucht - hat, nichtGekauft: hat === 0 });
        if (hat === 0) nichtGekauft++;
      }
    }
    const kosten = r.kostenExakt * ns.skala;
    const score = Math.abs(ns.kcal - slot.kcal) / 40 + Math.abs(kosten - altKosten) * 1.5
      + Math.max(0, slot.protein - ns.protein) / 4 + (modus === 'keinbock' ? inf.aufwand * 2 : 0)
      + fehlt.length * 25 + nichtGekauft * 200;
    liste.push({ r, mild: e.mild, slot: ns, fehlt, nichtGekauft, kosten, aufwand: inf.aufwand, rest: inf.rest, score });
  }
  liste.sort((a, b) => a.score - b.score);
  return liste;
}
function tauscheSlot(z, wi, ti, si, kandidat, grund) {
  z.wochen[wi].tage[ti].slots[si] = Object.assign({}, kandidat.slot, { getauscht: grund || 'tausch' });
}
/* Kein-Bock- bzw. Magen-Tag: alle offenen Mahlzeiten des Tages tauschen */
function tauscheTag(z, wi, ti, modus) {
  const woche = z.wochen[wi], tag = woche.tage[ti];
  const erg = { getauscht: 0, behalten: 0, nachkaufen: [] };
  for (let si = 0; si < tag.slots.length; si++) {
    const slot = tag.slots[si];
    if (slot.gegessen) continue;
    const inf = analysiereWoche(woche).slotInfo[ti][si];
    const r = rezeptVon(slot.rid, slot.mild);
    const passt = modus === 'magen' ? r.magenschonend : (inf.aufwand === 0 || (inf.rest && inf.aufwand <= 1));
    if (passt) { erg.behalten++; continue; }
    const kand = ersatzKandidaten(z, wi, ti, si, modus);
    let wahl;
    const aufListe = k => k.nichtGekauft === 0;
    if (modus === 'keinbock') {
      wahl = kand.find(k => k.fehlt.length === 0 && k.aufwand === 0);
      if (!wahl && inf.aufwand > 1) wahl = kand.find(k => k.fehlt.length === 0) || kand.find(aufListe) || kand[0];
    } else {
      wahl = kand.find(k => k.fehlt.length === 0) || kand.find(aufListe) || kand[0];
    }
    if (!wahl) { erg.behalten++; continue; }
    tauscheSlot(z, wi, ti, si, wahl, modus);
    erg.getauscht++;
    wahl.fehlt.forEach(f => { if (!erg.nachkaufen.some(x => x.id === f.id)) erg.nachkaufen.push(f); });
  }
  const l = z.log[tag.datum] = z.log[tag.datum] || {};
  if (modus === 'keinbock') l.keinBock = true; else l.magenTag = true;
  return erg;
}

<script data-teil="logik">
'use strict';
/* =====================================================================
   2c. SPIEL-LOGIK: XP, Level, Ränge, Streak, Wochen-Boss, Erfolge,
       Gewichts-Meilensteine, Maskottchen-Sprüche.
   XP wird IMMER aus dem gespeicherten Zustand berechnet (nicht addiert) –
   dadurch zieht „Rückgängig“ automatisch und exakt XP wieder ab.
   ===================================================================== */
const XP = {
  proKcal: 0.1,          // kcal / 10
  kappeFaktor: 1.1,      // zählt bis 110 % des Tagesziels
  tagesziel: 100, protein: 50, alle5: 50,
  streakProTag: 0.1, streakMax: 0.5,
  einkauf: 150, gewicht: 30, rekord: 100, boss: 300,
  zielQuote: 0.95,       // Tagesziel gilt ab 95 % als erreicht
  proteinQuote: 0.9,     // Proteinziel ab 90 %
};
const MEILENSTEINE = [2.5, 5, 7.5, 10];

/* Level n braucht 500 × n XP → Gesamt-XP für Level L = 250 · L · (L − 1) */
function xpFuerLevel(level) { return 250 * level * (level - 1); }
function levelAusXP(xp) { return Math.max(1, Math.floor((1 + Math.sqrt(1 + 4 * Math.max(0, xp) / 250)) / 2)); }
function rangFuer(level) { let r = RAENGE[0]; for (const x of RAENGE) if (level >= x.abLevel) r = x; return r; }

/* XP eines Tages (ohne Streak-Faktor) */
function tagesXPRoh(e) {
  const kappe = e.ziel.kcal * XP.kappeFaktor;
  let gezaehlt = 0, mahlXP = 0;
  for (const k of e.kcalListe) { mahlXP += Math.max(0, Math.min(k, kappe - gezaehlt)) * XP.proKcal; gezaehlt += k; }
  const zielErreicht = e.kcal >= e.ziel.kcal * XP.zielQuote;
  const proteinOk = e.protein >= e.ziel.protein * XP.proteinQuote;
  const alle5 = e.slotAnzahl === 5 && e.gegessen === 5;
  const bonus = (zielErreicht ? XP.tagesziel : 0) + (proteinOk ? XP.protein : 0) + (alle5 ? XP.alle5 : 0);
  return { mahlXP, bonus, zielErreicht, proteinOk, alle5 };
}

function bossStatus(woche, tu) {
  const hp = woche.tage.reduce((s, t) => s + t.zielKcal, 0);
  const schaden = woche.tage.reduce((s, t) => s + ((tu[t.datum] && tu[t.datum].kcal) || 0), 0);
  const b = BOSSE[woche.boss % BOSSE.length];
  return { hp, schaden, rest: Math.max(0, hp - schaden), besiegt: hp > 0 && schaden >= hp, name: b.name, emoji: b.emoji, spruch: b.spruch };
}

/* Gesamter Spielstand: XP, Level, Streak, pro Tag */
function berechneSpielstand(z) {
  const tu = tagesUebersicht(z), h = heute();
  const daten = Object.keys(tu).filter(d => d <= h).sort();
  let xp = 0, streak = 0, besteStreak = 0;
  const proTag = {};
  if (daten.length) {
    for (let d = daten[0]; d <= h; d = addTage(d, 1)) {
      const e = tu[d];
      let erreicht = false;
      if (e) {
        const r = tagesXPRoh(e);
        const mult = 1 + Math.min(XP.streakMax, XP.streakProTag * streak);
        const tagXP = Math.round((r.mahlXP + r.bonus) * mult);
        erreicht = r.zielErreicht;
        proTag[d] = Object.assign({ xp: tagXP, mult, streakVorher: streak }, r);
        xp += tagXP;
      }
      if (erreicht) { streak++; besteStreak = Math.max(besteStreak, streak); }
      else if (d < h) streak = 0; // heute zählt erst, wenn erreicht – sonst bleibt die Serie bis Mitternacht offen
    }
  }
  let bosse = 0;
  for (const w of z.wochen) {
    if (w.einkauf && w.einkauf.erledigt) xp += XP.einkauf;
    if (bossStatus(w, tu).besiegt) { xp += XP.boss; bosse++; }
  }
  if (z.profil) {
    const tage = new Set();
    let rekord = z.profil.startgewicht;
    const zunehmen = z.profil.zielgewicht > z.profil.startgewicht;
    for (const g of gewichteSortiert(z)) {
      if (!tage.has(g.datum)) { tage.add(g.datum); xp += XP.gewicht; }
      if (zunehmen && g.kg > rekord + 0.049 && rekord < z.profil.zielgewicht) { xp += XP.rekord; rekord = g.kg; }
    }
  }
  const level = levelAusXP(xp);
  const heuteInfo = proTag[h] || null;
  return {
    xp, level, rang: rangFuer(level), streak, besteStreak, bosse, proTag, tu,
    levelStart: xpFuerLevel(level), levelEnde: xpFuerLevel(level + 1),
    multHeute: 1 + Math.min(XP.streakMax, XP.streakProTag * (heuteInfo ? heuteInfo.streakVorher : streak)),
  };
}

/* XP, die eine Mahlzeit beim Abhaken ungefähr bringt (für die Animation) */
function xpVorschau(sp, e, kcal) {
  const kappe = e.ziel.kcal * XP.kappeFaktor;
  return Math.round(Math.max(0, Math.min(kcal, kappe - e.kcal)) * XP.proKcal * sp.multHeute);
}

/* ---------- Statistik & Erfolge ---------- */
function berechneStatistik(z, sp) {
  const s = {
    mahlzeiten: 0, zielTage: 0, alle5Tage: 0, proteinTage: 0, besteStreak: sp.besteStreak, bosse: sp.bosse,
    zunahme: 0, zielGewichtErreicht: false, unterBudgetWochen: 0, budgetMonate: 0, einkaeufe: 0,
    kuechen: 0, rezepte: 0, lazyTage: 0, magenTageZiel: 0, shakes: 0, fancy: 0, premium: 0,
    wiegungen: z.gewichte.length, level: sp.level, angebotsWochen: 0,
    kochmodus: z.zaehler.kochmodus || 0, exporte: z.zaehler.exporte || 0,
  };
  const kuechen = new Set(), rezepte = new Set();
  for (const w of z.wochen) {
    for (const t of w.tage) for (const sl of t.slots) if (sl.gegessen) {
      const r = rezeptVon(sl.rid, sl.mild);
      s.mahlzeiten++;
      if (r.kueche !== 'international') kuechen.add(r.kueche);
      rezepte.add(r.id);
      if (istShake(r)) s.shakes++;
      if (r.fancy) s.fancy++;
      if (r.premium) s.premium++;
    }
    if (w.einkauf && w.einkauf.erledigt) {
      s.einkaeufe++;
      const bons = z.kassenbons.filter(b => b.wocheId === w.id);
      const summe = bons.reduce((a, b) => a + b.betrag, 0);
      if (bons.length && summe <= w.budget) s.unterBudgetWochen++;
    }
    if (Object.keys(w.angebote || {}).length >= 3) s.angebotsWochen++;
  }
  for (const d of Object.keys(sp.proTag)) {
    const t = sp.proTag[d], e = sp.tu[d];
    if (t.zielErreicht) s.zielTage++;
    if (t.proteinOk) s.proteinTage++;
    if (t.alle5) s.alle5Tage++;
    if (e.keinBock && t.zielErreicht) s.lazyTage++;
    if (e.magenTag && t.zielErreicht) s.magenTageZiel++;
  }
  s.kuechen = kuechen.size; s.rezepte = rezepte.size;
  if (z.profil) {
    s.zunahme = rund1(aktuellesGewicht(z) - z.profil.startgewicht);
    s.zielGewichtErreicht = z.gewichte.length > 0 && aktuellesGewicht(z) >= z.profil.zielgewicht;
    // Abgeschlossene Monate mit Kassenbons im Budget
    const monate = {};
    for (const b of z.kassenbons) { const m = b.datum.slice(0, 7); monate[m] = (monate[m] || 0) + b.betrag; }
    const jetzt = heute().slice(0, 7);
    for (const m of Object.keys(monate)) if (m < jetzt && monate[m] <= z.profil.monatsbudget && z.kassenbons.filter(b => b.datum.startsWith(m)).length >= 2) s.budgetMonate++;
  }
  return s;
}
/* Neue Erfolge freischalten (bleiben dauerhaft freigeschaltet) */
function pruefeErfolge(z, sp) {
  const s = berechneStatistik(z, sp), neu = [];
  for (const e of ERFOLGE) if (!z.erfolge[e.id] && e.check(s)) { z.erfolge[e.id] = heute(); neu.push(e); }
  return neu;
}
/* Gewichts-Meilensteine (+2,5 / +5 / +7,5 / +10 kg) – einmalig feiern */
function neueMeilensteine(z) {
  if (!z.profil || !z.gewichte.length) return [];
  const zunahme = aktuellesGewicht(z) - z.profil.startgewicht, neu = [];
  for (const m of MEILENSTEINE) if (zunahme >= m - 0.001 && !z.meilensteine[m]) { z.meilensteine[m] = heute(); neu.push(m); }
  return neu;
}

/* ---------- Maskottchen: Spruch & Gesichtsausdruck ---------- */
const AUSDRUCK = {
  morgen: 'freut', mittag: 'freut', abend: 'freut', abgehakt: 'freut', ziel: 'stolz', protein: 'stolz',
  zuwenig: 'besorgt', keinbock: 'muede', magen: 'freut', prognose: 'wow', levelup: 'stolz', boss: 'kampf',
  einkauf: 'freut', gewicht: 'wow', streak: 'kampf', zuschnell: 'besorgt', defizit: 'besorgt', chill: 'muede',
  nacht: 'muede', keinplan: 'besorgt',
};
function spruch(kategorie, z) {
  const liste = SPRUECHE[kategorie] || SPRUECHE.abgehakt;
  const name = (z && z.profil && z.profil.name) ? z.profil.name : 'Bulk-Krieger';
  return { text: liste[Math.floor(Math.random() * liste.length)].replace('{name}', name), ausdruck: AUSDRUCK[kategorie] || 'freut', kategorie };
}
/* Passende Situation für den Start-Spruch */
function situation(z, sp, stunde) {
  const ft = findeTag(z, heute());
  if (!ft) return 'keinplan';
  const e = sp.tu[heute()];
  const quote = e ? e.kcal / e.ziel.kcal : 0;
  if (quote >= XP.zielQuote) return 'ziel';
  if (nimmtZuSchnellZu(z)) return 'zuschnell';
  if (e && e.keinBock) return 'keinbock';
  if (e && e.magenTag) return 'magen';
  if (stunde >= 22 || stunde < 5) return 'nacht';
  if (stunde >= 19 && quote < 0.75) return 'zuwenig';
  if (ft.tag.chill && stunde < 12) return 'chill';
  if (sp.streak >= 3 && stunde < 12) return 'streak';
  if (stunde < 11) return 'morgen';
  if (stunde < 17) return 'mittag';
  return 'abend';
}

function sichtbareWochen() { return Z.wochen.filter(w => w.tage.length).sort((a, b) => a.start < b.start ? -1 : 1); }

  const ws = sichtbareWochen();
  if (!ws.length) return null;
  if (UI.wocheId) { const w = ws.find(x => x.id === UI.wocheId); if (w) return w; }

function obPruefe() {
  const o = obEntwurf(), s = UI.obSchritt;
  if (s === 1) {
    if (!(o.groesse >= 120 && o.groesse <= 230)) return 'Bitte eine Größe zwischen 120 und 230 cm eingeben.';
    if (!(o.startgewicht >= 30 && o.startgewicht <= 250)) return 'Bitte ein realistisches Gewicht eingeben.';
    if (!(o.zielgewicht >= 30 && o.zielgewicht <= 250)) return 'Bitte ein realistisches Zielgewicht eingeben.';
  }
  if (s === 2) {
    if (!(o.alter >= 14 && o.alter <= 99)) return 'Bitte dein Alter eingeben (14–99).';
    if (!o.geschlecht) return 'Bitte ein Geschlecht wählen.';

  if (p.fix.status === 'ok') return `🎯 ${fmtKg(p.zielKg)} ≈ ${fmtDatum(addTage(heute(), p.fix.tage))}`;

}

    if (f.zeit && r.zeitMin > f.zeit) return false;

/* Rezept-Details: Mengen passen sich an die geplante Portion an.
   Am Koch-Tag einer Kette: Basis gleich für alle Portionen kochen. */
function rezeptAnsicht(rid, mild, ctx) {
  const r = rezeptVon(rid, mild);
  let skala = 1, inf = null;
  if (ctx) {
    const w = Z.wochen[ctx.w], slot = w && w.tage[ctx.t] && w.tage[ctx.t].slots[ctx.s];
    if (slot && slot.rid === rid) { skala = slot.skala; inf = analysiereWoche(w).slotInfo[ctx.t][ctx.s]; } else ctx = null;
  }
  const rest = !!(inf && inf.rest), kochePortionen = inf && !inf.rest && inf.portionen > 1 ? inf.portionen : 1;
  const istKette = !!kettenSchluessel(r);
  const basisZut = [], eigeneZut = [];
  for (const z of r.zutaten) {
    const ausBasis = istKette && (r.basisId ? z.basis : true);
    if (ausBasis) basisZut.push({ z, menge: z.menge * (kochePortionen > 1 ? inf.skalaSumme : skala) });
    else eigeneZut.push({ z, menge: z.menge * skala });
  }
  const schritte = r.schritte.map((t, i) => ({ text: t, basis: r.basisId ? i < r.basisSchritte : false }));
  const sichtbareSchritte = rest ? schritte.filter(s => !s.basis) : schritte;
  return { r, skala, inf, rest, kochePortionen, istKette, basisZut, eigeneZut, schritte, sichtbareSchritte };
}

  return `<ul class="zutaten">${eintraege.map(({ z, menge }) => `<li><span>${esc(fmtMenge(z.id, menge))}</span>${ZUTAT[z.id].vorrat ? '<small class="muted">Vorrat</small>' : ''}</li>`).join('')}</ul>`;
}

/* Kochmodus: große Schrift, Schritt für Schritt, Bildschirm bleibt an */
async function wachHalten(an) {
  try {
    if (an && 'wakeLock' in navigator) { UI.wakeLock = await navigator.wakeLock.request('screen'); }
    else if (!an && UI.wakeLock) { await UI.wakeLock.release(); UI.wakeLock = null; }
  } catch (e) { UI.wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (UI.koch && document.visibilityState === 'visible') wachHalten(true); });
function renderKochmodus() {
  const k = UI.koch, v = k.ansicht, schritte = v.sichtbareSchritte, i = k.schritt, fertig = i >= schritte.length;
  const root = $('#overlay-root');
  let el = $('#kochmodus');
  if (!el) { el = document.createElement('div'); el.id = 'kochmodus'; el.className = 'kochmodus'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); root.appendChild(el); }
  el.innerHTML = `<header class="koch-kopf"><span>${v.r.emoji} ${esc(v.r.name)}</span><button class="btn-x gross" data-a="koch-ende" aria-label="Kochmodus beenden">✕</button></header>
    <div class="koch-fortschritt">${schritte.map((_, j) => `<i class="${j < i ? 'fertig' : j === i ? 'aktiv' : ''}"></i>`).join('')}</div>
    <main class="koch-inhalt">${fertig
      ? `${maskottchen('stolz', 'gross')}<p class="koch-schritt">Fertig! Guten Appetit – Itadakimasu! 🎉</p>`
      : `<p class="koch-nr">Schritt ${i + 1} von ${schritte.length}${schritte[i].basis ? ' · Basis' : ''}</p><p class="koch-schritt">${esc(schritte[i].text)}</p>`}
      <details class="koch-zutaten"><summary>🧺 Zutaten anzeigen</summary>${zutatenListe(v.basisZut.concat(v.eigeneZut))}</details>
      <p class="muted klein">${UI.wakeLock ? '🔆 Bildschirm bleibt an.' : 'Tipp: Bildschirm-Sperre ggf. selbst verlängern.'}</p></main>
    <footer class="koch-fuss"><button class="btn btn-ghost btn-gross" data-a="koch-zurueck" ${i === 0 ? 'disabled' : ''}>◀ Zurück</button>
      ${fertig ? '<button class="btn btn-gruen btn-gross" data-a="koch-ende">Schließen</button>' : `<button class="btn btn-gross" data-a="koch-weiter">${i === schritte.length - 1 ? 'Fertig ✓' : 'Weiter ▶'}</button>`}</footer>`;
}

/* ---------- Angebots-Check & Generieren ---------- */
function startOptionen() {
  const h = heute(), p = Z.profil, ws = sichtbareWochen();
  const naechsterEinkauf = (() => { for (let i = 0; i < 7; i++) { const d = addTage(h, i); if (wochentag(d) === p.einkaufstag) return d; } return h; })();
  const opt = [{ d: h, t: 'Heute' }, { d: addTage(h, 1), t: 'Morgen' }];
  if (naechsterEinkauf > addTage(h, 1)) opt.push({ d: naechsterEinkauf, t: 'Nächster Einkaufstag' });
  const letzte = ws.length ? ws[ws.length - 1] : null;
  if (letzte) { const nach = addTage(letzte.tage[letzte.tage.length - 1].datum, 1); if (nach > h && !opt.some(o => o.d === nach)) opt.push({ d: nach, t: 'Nach dem aktuellen Plan' }); }
  return opt.map(o => Object.assign(o, { gesperrt: hatGegessenesAb(o.d) }));
}
function hatGegessenesAb(start) {
  const ende = addTage(start, 6);
  return Z.wochen.some(w => w.tage.some(t => t.datum >= start && t.datum <= ende && t.slots.some(s => s.gegessen)));
}
function oeffneAngebotsCheck() {
  const opts = startOptionen();
  if (!UI.genStart || !opts.some(o => o.d === UI.genStart && !o.gesperrt)) {
    const frei = opts.filter(o => !o.gesperrt);
    const vorschlag = frei.find(o => o.t === 'Nach dem aktuellen Plan') || frei.find(o => o.t === 'Heute') || frei[0];
    UI.genStart = vorschlag ? vorschlag.d : null;
  }
  UI.sheet = 'angebote';
  oeffneSheet(angebotsSheet());
}
function angebotsSheet() {
  const opts = startOptionen(), q = UI.angebotSuche.trim().toLowerCase();
  const zut = ZUTATEN.filter(z => !q || z.name.toLowerCase().includes(q)).sort((a, b) => (b.id in Z.angebote) - (a.id in Z.angebote) || a.vorrat - b.vorrat || a.name.localeCompare(b.name, 'de'));
  const n = Object.keys(Z.angebote).length;
  return `<h2 class="titel">🏷️ Angebots-Check</h2>
    <p class="muted">Schau kurz in die Prospekte und tippe an, was diese Woche im Angebot ist (Preis optional). Ich plane dann bevorzugt damit.</p>
    <div class="prospekte">${Z.prospekte.map(p => `<a class="btn btn-ghost btn-klein" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.name)} ↗</a>`).join('')}</div>
    <div class="feld"><span>Wochenstart</span><div class="wahl-reihe umbruch">${opts.map(o => `<button class="wahl ${UI.genStart === o.d ? 'an' : ''}" data-a="gen-start" data-wert="${o.d}" ${o.gesperrt ? 'disabled title="An diesen Tagen ist schon etwas abgehakt"' : ''}>${o.t}<small> ${fmtTag(o.d)}</small></button>`).join('')}</div></div>
    <input type="search" placeholder="Zutat suchen …" value="${esc(UI.angebotSuche)}" data-in="angebot-suche" aria-label="Zutat suchen">
    <p class="muted klein">${n ? `${n} Angebot${n > 1 ? 'e' : ''} markiert.` : 'Keine Angebote? Einfach direkt generieren.'}</p>
    <ul class="angebot-liste" id="angebot-liste">${zut.slice(0, 60).map(z => {
      const an = z.id in Z.angebote;
      return `<li class="${an ? 'an' : ''}"><button class="angebot-btn" data-a="angebot-toggle" data-id="${z.id}" aria-pressed="${an}"><span>${an ? '🏷️' : '◻️'}</span><span>${esc(z.name)}<small class="muted"> · ${fmtEuro(zutatPreis(z.id))}</small></span></button>
        ${an ? `<input type="number" inputmode="decimal" step="0.01" min="0" placeholder="Angebotspreis €" value="${Z.angebote[z.id] != null ? Z.angebote[z.id] : ''}" data-in="angebot-preis" data-id="${z.id}" aria-label="Angebotspreis für ${esc(z.name)}">` : ''}</li>`;
    }).join('')}</ul>
    <button class="btn btn-gross voll sticky-unten" data-a="generieren" ${UI.genStart ? '' : 'disabled'}>🍳 Woche generieren</button>`;
}
function fuegeWocheEin(w) {
  const ende = addTage(w.start, 6);
  for (const alt of Z.wochen) alt.tage = alt.tage.filter(t => t.datum < w.start || t.datum > ende);
  Z.wochen = Z.wochen.filter(x => x.tage.length || (x.einkauf && x.einkauf.erledigt));
  Z.wochen.push(w);
  Z.wochen.sort((a, b) => a.start < b.start ? -1 : 1);
}
function generieren() {
  if (UI.generiere || !UI.genStart) return;
  UI.generiere = true;
  schliesseSheet();
  const lade = document.createElement('div');
  lade.className = 'overlay lade';
  lade.innerHTML = `<div class="overlay-speed" aria-hidden="true"></div><div class="overlay-inhalt">${maskottchen('kampf', 'gross wackel')}<p class="overlay-gross">KOCHE PLAN …</p><p class="overlay-text">Ich schnippel Rezepte, rechne Kalorien und jage Angebote!</p></div>`;
  $('#overlay-root').appendChild(lade);
  setTimeout(() => {
    try {
      aktion(() => {
        const angebote = Object.assign({}, Z.angebote);
        const w = generiereWoche(Z, { start: UI.genStart, angebote });
        fuegeWocheEin(w);
        Z.angebote = {};
        UI.wocheId = w.id;
        setzeSpruch(w.warnungen.some(x => x.typ !== 'info') ? 'boss' : 'einkauf');
        UI.spruch.text = w.warnungen.some(x => x.typ !== 'info') ? 'Fertig! Ein paar Kleinigkeiten passen nicht perfekt – schau unter „Was nicht ganz passt“.' : `Neue Woche steht! Boss: ${BOSSE[w.boss].name}. Ikuzo!`;
      });
      UI.tab = 'woche';
      render();
      toast('🍳 Neue Woche generiert!');
    } catch (e) {
      console.error(e);
      toast('⚠️ ' + esc(e.message || 'Generieren fehlgeschlagen'), 'fehler');
    } finally {
      lade.remove();
      UI.generiere = false;
      window.scrollTo(0, 0);
    }
  }, 60);
}

/* =====================================================================
   TAB „PROFIL“: Level, Gewicht, Diagramm, Prognose, Erfolge, Einstellungen
   ===================================================================== */
function gewichtsDiagramm(pr) {
  const p = Z.profil, g = gewichteSortiert(Z);
  const W = 340, H = 210, L = 36, R = 10, O = 14, U = 28;
  const punkte = g.map(x => ({ d: x.datum, kg: x.kg }));
  const startDatum = punkte.length && punkte[0].d < Z.erstelltAm ? punkte[0].d : Z.erstelltAm;
  if (!punkte.length || punkte[0].d > startDatum) punkte.unshift({ d: startDatum, kg: p.startgewicht, start: true });
  const sim = pr.fix.status === 'ok' || pr.fix.status === 'plateau' ? pr.fix : (pr.ziel.status === 'ok' ? pr.ziel : null);
  const h = heute();
  let proj = [];
  if (sim && sim.verlauf && pr.kg < pr.zielKg) proj = sim.verlauf.filter(v => v.t <= 730).map(v => ({ d: addTage(h, Math.round(v.t)), kg: v.kg }));
  const alle = punkte.concat(proj);
  const x0 = startDatum, x1 = alle.reduce((m, q) => q.d > m ? q.d : m, addTage(h, 14));
  const span = Math.max(14, tageZwischen(x0, x1));
  const kgs = alle.map(q => q.kg).concat([p.zielgewicht, p.startgewicht]);
  const yMin = Math.floor(Math.min(...kgs) - 1), yMax = Math.ceil(Math.max(...kgs) + 1);
  const X = d => L + (W - L - R) * tageZwischen(x0, d) / span;
  const Y = kg => O + (H - O - U) * (yMax - kg) / (yMax - yMin);
  const schritt = yMax - yMin > 12 ? 4 : yMax - yMin > 6 ? 2 : 1;
  let grid = '';
  for (let k = Math.ceil(yMin / schritt) * schritt; k <= yMax; k += schritt) grid += `<line x1="${L}" x2="${W - R}" y1="${Y(k)}" y2="${Y(k)}" class="ch-grid"/><text x="${L - 6}" y="${Y(k) + 4}" class="ch-label" text-anchor="end">${k}</text>`;
  for (let i = 0; i <= 3; i++) { const d = addTage(x0, Math.round(span * i / 3)); grid += `<text x="${X(d)}" y="${H - 8}" class="ch-label" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${fmtTag(d).slice(4, 10)}</text>`; }
  const linie = punkte.map((q, i) => `${i ? 'L' : 'M'}${X(q.d).toFixed(1)} ${Y(q.kg).toFixed(1)}`).join(' ');
  const projStart = { d: h, kg: pr.kg };
  const projPfad = proj.length ? [projStart].concat(proj).map((q, i) => `${i ? 'L' : 'M'}${X(q.d).toFixed(1)} ${Y(q.kg).toFixed(1)}`).join(' ') : '';
  const ziel = `<line x1="${L}" x2="${W - R}" y1="${Y(p.zielgewicht)}" y2="${Y(p.zielgewicht)}" class="ch-ziel"/><text x="${W - R - 2}" y="${Y(p.zielgewicht) - 5}" class="ch-label ch-ziel-text" text-anchor="end">🎯 ${fmtZahl(p.zielgewicht, p.zielgewicht % 1 ? 1 : 0)} kg</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf mit Prognose">
    ${grid}${ziel}
    ${projPfad ? `<path d="${projPfad}" class="ch-prognose"/>` : ''}
    <path d="${linie}" class="ch-linie"/>
    ${punkte.map(q => `<circle cx="${X(q.d).toFixed(1)}" cy="${Y(q.kg).toFixed(1)}" r="${q.start ? 4 : 4.5}" class="${q.start ? 'ch-start' : 'ch-punkt'}"><title>${fmtDatum(q.d)}: ${fmtKg(q.kg)}</title></circle>`).join('')}
  </svg>
  <p class="muted klein chart-legende"><span class="leg leg-linie"></span> gemessen <span class="leg leg-prognose"></span> Prognose <span class="leg leg-ziel"></span> Ziel</p>`;
}
function prognoseFixText(pr) {
  const f = pr.fix;
  if (pr.kg >= pr.zielKg) return `🎉 Du hast dein Zielgewicht von ${fmtKg(pr.zielKg)} erreicht! Zeit für ein neues Ziel?`;
  if (f.status === 'ok') return `Bei <b>${fmtZahl(pr.kcal)} kcal/Tag</b> wiegst du in ca. <b>${Math.max(1, Math.round(f.wochen))} Wochen ${fmtKg(pr.zielKg)}</b> → voraussichtlich am <b>${fmtDatum(addTage(heute(), f.tage))}</b>.`;
  if (f.status === 'defizit') return `Mit ${fmtZahl(pr.kcal)} kcal/Tag liegst du <b>${fmtZahl(-f.ueberschuss)} kcal unter</b> deinem Verbrauch (${fmtZahl(pr.tdee)} kcal) – so nimmst du nicht zu. Ein Shake extra pro Tag hilft schon! 🥤`;
  return `Mit ${fmtZahl(pr.kcal)} kcal/Tag pendelst du dich bei ca. <b>${fmtKg(f.plateauKg)}</b> ein – fürs Ziel braucht’s etwas mehr.`;
}
function prognosePanel() {
  const pr = prognose(Z, null, SP.tu), z = pr.ziel;
  const basis = pr.schnitt.quelle === 'echt' ? `Dein Schnitt der letzten ${pr.schnitt.tage} Tage: <b>${fmtZahl(pr.kcal)} kcal</b>.` : `Noch weniger als 3 Tage Daten – ich rechne vorerst mit deinem Tagesziel (${fmtZahl(pr.kcal)} kcal).`;
  const wert = UI.wasWaere || Math.round(pr.kcal / 50) * 50;
  const schnell = nimmtZuSchnellZu(Z), trend = gewichtsTrend(Z, 21), kal = Z.kalibrierung;
  return `<section class="panel">
    <h3 class="titel-klein">🔮 Prognose</h3>

    ${pr.kg < pr.zielKg && z.status === 'ok' ? `<p>Wenn du jeden Tag dein Ziel triffst: <b>${Math.max(1, Math.round(z.wochen))} Wochen</b> (≈ ${fmtDatum(addTage(heute(), z.tage))}).</p>` : ''}
    ${trend ? `<p class="muted klein">Aktueller Trend: ${trend.kgProWoche >= 0 ? '+' : ''}${fmtZahl(trend.kgProWoche, 2)} kg/Woche.</p>` : ''}
    ${schnell ? `<div class="hinweis">${sprechblase(spruch('zuschnell', Z), 'klein')}<button class="btn btn-klein" data-a="ueberschuss-senken">Überschuss −100 kcal</button></div>` : ''}
    <label class="feld"><span>Was wäre, wenn ich <b id="ww-kcal">${fmtZahl(wert)}</b> kcal am Tag esse?</span>
      <input type="range" min="1600" max="4500" step="50" value="${wert}" data-live="waswaere" aria-label="Kalorien pro Tag für die Prognose"></label>
    <p id="ww-text" class="ww-text">${prognoseFixText(prognose(Z, wert, SP.tu))}</p>
    <p class="muted klein">TDEE: ${fmtZahl(pr.tdee)} kcal${Z.profil.tdeeKorrektur ? ` (kalibriert: ${Z.profil.tdeeKorrektur > 0 ? '+' : ''}${Z.profil.tdeeKorrektur} kcal)` : ''}. Annahme: 7.700 kcal Überschuss ≈ 1 kg.${kal.letzte ? ` Letzte Kalibrierung: ${fmtDatum(kal.letzte)}.` : ' Ab 3 Wochen und 4 Wiegungen kalibriere ich automatisch.'}</p>
    <p class="muted klein">⚠️ Die Prognose ist eine Schätzung – echte Körper sind keine Taschenrechner.</p>
  </section>`;
}

  gewicht: f => {
    const kg = zahl(f.kg.value), datum = f.datum.value || heute();
    if (!kg || kg < 30 || kg > 250) { toast('Bitte ein Gewicht zwischen 30 und 250 kg eingeben.', 'fehler'); return; }
    if (datum > heute()) { toast('Datum liegt in der Zukunft.', 'fehler'); return; }
    const rekordVorher = Math.max(Z.profil.startgewicht, ...Z.gewichte.map(g => g.kg));
    aktion(() => {
      const da = Z.gewichte.find(g => g.datum === datum);
      if (da) da.kg = rund1(kg); else Z.gewichte.push({ id: erstelleId('g'), datum, kg: rund1(kg) });
      aktualisiereZiele(Z);
      setzeSpruch('gewicht');
      if (kg > rekordVorher + 0.04 && Z.profil.zielgewicht > Z.profil.startgewicht) UI.spruch = { text: `Neues Höchstgewicht: ${fmtKg(kg)}! +100 XP Bonus! 💪`, ausdruck: 'wow' };
    }, { gewicht: true, xpPos: posVon(f.querySelector('button')) });
    pruefeUndKalibriere(); render();
  },
};
function setzeEinstellung(el) {
  const pfad = el.dataset.set, roh = el.value;
  if (pfad.startsWith('chill.')) {
    const i = +pfad.slice(6), c = (Z.profil.chillTage || [null, null]).slice();
    c[i] = roh === 'auto' ? null : +roh;
    Z.profil.chillTage = c[0] != null && c[1] != null && c[0] !== c[1] ? c : (c[0] == null && c[1] == null ? null : c);
    speichern(); render(); return;
  }
  const [obj, feld] = pfad.split('.');
  const ziel = obj === 'profil' ? Z.profil : Z.einstellungen;
  const textFelder = ['name', 'geschlecht', 'magenModus', 'theme'];
  let wert = textFelder.includes(feld) ? roh : zahl(roh);
  if (wert == null || wert === '') { render(); return; }
  const grenzen = { groesse: [120, 230], alter: [14, 99], startgewicht: [30, 250], zielgewicht: [30, 250], ueberschuss: [250, 700], monatsbudget: [80, 1000] };
  if (grenzen[feld]) wert = clamp(wert, grenzen[feld][0], grenzen[feld][1]);
  aktion(() => { ziel[feld] = wert; aktualisiereZiele(Z); });
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.tagName === 'INPUT') return; // Checkboxen laufen über 'change'
  const fn = HANDLER[el.dataset.a];
  if (!fn) return;
  ev.preventDefault();
  try { fn(el, ev); } catch (e) { console.error(e); toast('⚠️ Da ist etwas schiefgelaufen: ' + esc(e.message), 'fehler'); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  try {
    if (el.tagName === 'INPUT' && el.type === 'checkbox' && HANDLER[el.dataset.a]) { HANDLER[el.dataset.a](el, ev); return; }
    if (el.dataset.set) { setzeEinstellung(el); return; }
    if (el.dataset.preis) {
      const v = zahl(el.value), id = el.dataset.preis;
      if (v && v > 0) { if (Math.abs(v - ZUTAT[id].preis) < 0.005) delete Z.preise[id]; else Z.preise[id] = rund2(v); PREIS_OVERRIDES = Z.preise; initRezepte(); speichern(); toast('💶 Preis gespeichert.'); }
      return;
    }
    if (el.dataset.prospekt != null) { const p = Z.prospekte[+el.dataset.prospekt]; if (p && /^https?:\/\//.test(el.value)) { p.url = el.value.trim(); speichern(); toast('Link gespeichert.'); } return; }
    if (el.dataset.in === 'angebot-preis') { const v = zahl(el.value); Z.angebote[el.dataset.id] = v && v > 0 ? rund2(v) : null; speichern(); return; }
    if (el.id === 'import-datei') importieren(el);
  } catch (e) { console.error(e); toast('⚠️ ' + esc(e.message), 'fehler'); }
});
document.addEventListener('input', ev => {
  const el = ev.target, d = el.dataset;
  if (d.ob) { const o = obEntwurf(); o[d.ob] = d.ob === 'name' ? el.value : zahl(el.value); }
  if (d.live === 'ob-ue') { const l = $('#ob-ue'); if (l) l.textContent = el.value + ' kcal'; }
  if (d.live === 'ue-label') { const l = $('#ue-label'); if (l) l.textContent = el.value + ' kcal'; }
  if (d.live === 'waswaere') {
    UI.wasWaere = +el.value;
    $('#ww-kcal').textContent = fmtZahl(UI.wasWaere);
    $('#ww-text').innerHTML = prognoseFixText(prognose(Z, UI.wasWaere, SP.tu));
  }
  if (d.in === 'suche') {
    UI.suche = el.value;
    const liste = rezeptGefiltert(), ziel = $('.rezept-liste') || $('.rezepte-kopf + section');
    const html = liste.length ? `<ul class="rezept-liste">${liste.map(rezeptKarte).join('')}</ul>` : `<section class="panel leer">${maskottchen('besorgt', 'mittel')}<p>Nichts gefunden. Filter lockern?</p><button class="btn" data-a="filter-reset">Filter zurücksetzen</button></section>`;
    if (ziel) ziel.outerHTML = html;
    const t = $('.rezepte-kopf .titel small'); if (t) t.textContent = `(${liste.length})`;
  }
  if (d.in === 'angebot-suche') {
    UI.angebotSuche = el.value;
    const tmp = document.createElement('div'); tmp.innerHTML = angebotsSheet();
    const neu = tmp.querySelector('#angebot-liste'), alt = $('#angebot-liste');
    if (neu && alt) alt.innerHTML = neu.innerHTML;
  }
  if (d.in === 'unv-suche' || d.in === 'preis-suche') {
    if (d.in === 'unv-suche') UI.unvertraeglichSuche = el.value; else UI.preisSuche = el.value;
    const id = d.in === 'unv-suche' ? '#unv-liste' : '#preis-liste';
    const tmp = document.createElement('div'); tmp.innerHTML = renderEinstellungen();
    const neu = tmp.querySelector(id), alt = $(id);
    if (neu && alt) alt.innerHTML = neu.innerHTML;
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target, fn = FORMULARE[f.dataset.form];
  if (!fn) return;
  ev.preventDefault();
  try { fn(f); if (f.dataset.form === 'extra' || f.dataset.form === 'bon') f.reset(); } catch (e) { console.error(e); toast('⚠️ ' + esc(e.message), 'fehler'); }
});
document.addEventListener('toggle', ev => {
  const el = ev.target;
  if (el.tagName !== 'DETAILS' || !el.dataset.id) return;
  UI.offen = UI.offen || new Set();
  if (el.open) UI.offen.add(el.dataset.id); else UI.offen.delete(el.dataset.id);
}, true);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (UI.koch) HANDLER['koch-ende']();
  else if ($('#overlay-root .overlay:not(.lade)')) $('#overlay-root .overlay:not(.lade)').remove();
  else if ($('#sheet-root .sheet')) schliesseSheet();
});
/* Neuer Tag, während die App offen ist → neu zeichnen */
let letzterTag = heute();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && heute() !== letzterTag) { letzterTag = heute(); UI.spruch = null; if (Z.profil) { aktualisiereZiele(Z); speichern(); } render(); }
});

/* =====================================================================
   PWA: Service Worker + Update-Banner
   ===================================================================== */
function zeigeUpdateBanner(worker) {
  UI.wartenderWorker = worker;
  if ($('#update-banner')) return;
  const b = document.createElement('div');
  b.id = 'update-banner'; b.className = 'update-banner'; b.setAttribute('role', 'status');
  b.innerHTML = '<span>✨ Neues Update – neu laden?</span><button class="btn btn-klein" data-a="update-laden">Neu laden</button><button class="btn-x" data-a="update-zu" aria-label="Später">✕</button>';
  document.body.appendChild(b);
}
function registriereSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) zeigeUpdateBanner(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) zeigeUpdateBanner(nw); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(e => console.warn('Service Worker nicht registriert:', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (UI.updateAngefordert && !UI.neuGeladen) { UI.neuGeladen = true; location.reload(); }
  });
}

/* =====================================================================
   START
   ===================================================================== */
(function start() {
  try {
    if (Z.profil) { aktualisiereZiele(Z); pruefeUndKalibriere(); speichern(); }
    render();
  } catch (e) {
    console.error(e);
    $('#main').innerHTML = `<section class="panel"><h2>Uff, da ging was schief 😵</h2><p>${esc(e.message)}</p><p>Tipp: Profil → Backup exportieren und mir den Fehler melden.</p></section>`;
  }
  registriereSW();
})();
</script>
