<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Icons rendern</title></head>
<body style="font:16px system-ui;padding:20px">
<h1>PNG-Icons rendern</h1>
<p>Nur mit <code>node tools/devserver.js</code> öffnen: <code>/tools/icons.html</code>. Speichert die PNGs nach <code>icons/</code>.</p>
<div id="log"></div>
<script>
const AUFTRAEGE = [
  ['icons/icon.svg', 192, 'icons/icon-192.png'],
  ['icons/icon.svg', 512, 'icons/icon-512.png'],
  ['icons/icon-maskable.svg', 192, 'icons/icon-maskable-192.png'],
  ['icons/icon-maskable.svg', 512, 'icons/icon-maskable-512.png'],
  ['icons/icon-apple.svg', 180, 'icons/apple-touch-icon.png'],
];
async function render([quelle, groesse, ziel]) {
  const img = new Image();
  img.src = '/' + quelle + '?v=' + Date.now();
  await img.decode();
  const c = document.createElement('canvas'); c.width = c.height = groesse;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, groesse, groesse);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const antwort = await fetch('/__speichern?datei=' + encodeURIComponent(ziel), { method: 'POST', body: blob });
  document.getElementById('log').insertAdjacentHTML('beforeend', `<p>${ziel}: ${antwort.ok ? '✅' : '❌'} (${blob.size} Bytes)</p>`);
  document.body.appendChild(c);
}
(async () => { for (const a of AUFTRAEGE) await render(a); document.title = 'FERTIG'; })();
</script>
</body></html>
